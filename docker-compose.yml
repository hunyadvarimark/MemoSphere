services:
  db:
    image: postgres:18
    container_name: memosphere-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER hiányzik a .env fájlból}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD hiányzik a .env fájlból}
      POSTGRES_DB: ${DB_NAME:?DB_NAME hiányzik a .env fájlból}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: MemoSphere.Api/Dockerfile
    container_name: memosphere-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - LOCAL_DOCKER_CONNECTION_STRING=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY hiányzik a .env fájlból}
      - JwtSettings__Issuer=MemoSphereApi
      - JwtSettings__Audience=MemoSphereWpfClient
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY hiányzik a .env fájlból}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: