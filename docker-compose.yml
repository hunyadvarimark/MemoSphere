version: '3.8'

services:
  db:
    image: postgres:18
    container_name: memosphere-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: titkosjelszo
      POSTGRES_DB: MemoSphereDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: MemoSphere.Api/Dockerfile
    container_name: memosphere-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development  
      - LOCAL_DOCKER_CONNECTION_STRING=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JwtSettings__Issuer=MemoSphereApi
      - JwtSettings__Audience=MemoSphereWpfClient
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
    depends_on:
      - db

volumes:
  pgdata: